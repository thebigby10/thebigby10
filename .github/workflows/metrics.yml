# Save this file in your profile repo (thebigby10/thebigby10) at:
#   .github/workflows/metrics.yml
#
# ONE-TIME SETUP (needs a token, ~2 min):
# 1. GitHub -> Settings -> Developer settings -> Personal access tokens
#    -> Tokens (classic) -> Generate new token
#    Scopes needed: public_repo, read:user  (no expiry, or set a reminder)
# 2. In the thebigby10/thebigby10 repo: Settings -> Secrets and variables
#    -> Actions -> New repository secret
#    Name: METRICS_TOKEN   Value: <the token>
# 3. Actions tab -> "generate metrics" -> Run workflow
#
# It generates github-metrics.svg (stats + top languages + activity)
# directly into the repo, so the README never depends on an external
# service being up.

name: generate metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thebigby10
          filename: github-metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main

          base: header, activity, repositories
          config_timezone: Asia/Dhaka
          config_display: large

          # Top languages (replaces the old top-langs card)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css

          # Contribution calendar (replaces the old stats card visuals)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
